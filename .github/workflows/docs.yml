name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Writerside/**"
      - "core/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTANCE: Writerside/a
  ARTIFACT: webHelpA2-all.zip
  DOCKER_VERSION: "2026.09.0357"

jobs:
  writerside:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Writerside docs
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          artifact: ${{ env.ARTIFACT }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Check Writerside build report
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ env.INSTANCE }}

      - name: Upload Writerside artifact
        uses: actions/upload-artifact@v4
        with:
          name: writerside
          path: artifacts/${{ env.ARTIFACT }}
          retention-days: 7

  dokka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Dokka docs
        run: ./gradlew :core:dokkaGenerateHtml

      - name: Upload Dokka artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokka
          path: core/build/dokka/html
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: [writerside, dokka]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Writerside artifact
        uses: actions/download-artifact@v4
        with:
          name: writerside

      - name: Download Dokka artifact
        uses: actions/download-artifact@v4
        with:
          name: dokka
          path: dokka

      - name: Assemble site
        run: |
          mkdir -p site
          unzip -q -O UTF-8 "$ARTIFACT" -d site
          mkdir -p site/api
          cp -r dokka/. site/api/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
